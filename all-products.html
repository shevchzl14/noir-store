<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR — Все товары</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel2: #191919;
    --line: #2a2a2a;
    --text: #f5f5f5;
    --muted: #969696;
    --white: #ffffff;
}

body {
/    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}


/* ================= HEADER ================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: 76px;

    display: grid;
    grid-template-columns: 190px 1fr 300px;

    align-items: center;
    gap: 25px;

    padding: 0 32px;

    background: rgba(10,10,10,.97);
    border-bottom: 1px solid var(--line);
}

.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 8px;
}

.search {
    display: flex;
    align-items: center;

    max-width: 650px;
    width: 100%;
    margin: auto;

    background: #111;
    border: 1px solid var(--line);
}

.search input {
    width: 100%;

    padding: 13px 16px;

    border: 0;
    outline: none;

    background: transparent;
    color: white;
}

.search input::placeholder {
    color: #777;
}

.actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
}

.icon-btn {
    position: relative;

    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: 1px solid var(--line);
    color: white;
}

.icon-btn:hover {
    background: white;
    color: black;
}

.icon-btn svg {
    width: 21px;
    height: 21px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
}

.badge {
    position: absolute;

    top: -7px;
    right: -7px;

    min-width: 19px;
    height: 19px;

    padding: 0 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;
    color: black;

    font-size: 11px;
    font-weight: bold;
}


/* ================= PAGE ================= */

.page {
    display: grid;
    grid-template-columns: 210px 1fr;
    min-height: calc(100vh - 76px);
}


/* ================= SIDEBAR ================= */

.sidebar {
    padding: 30px 18px;

    background: #0d0d0d;
    border-right: 1px solid var(--line);
}

.sidebar-title {
    margin-bottom: 20px;

    color: #777;

    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.category {
    width: 100%;

    display: block;

    padding: 12px 10px;
    margin-bottom: 4px;

    text-align: left;

    background: transparent;
    border: 0;

    color: #aaa;

    transition: .2s;
}

.category:hover,
.category.active {
    color: white;
    background: #1c1c1c;
}


/* ================= CONTENT ================= */

.content {
    min-width: 0;
    padding: 30px;
}


/* ================= PAGE TITLE ================= */

.page-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    margin-bottom: 25px;

    padding-bottom: 20px;

    border-bottom: 1px solid var(--line);
}

.page-heading h1 {
    font-size: 34px;
    letter-spacing: -1px;
}

.page-heading p {
    margin-top: 8px;

    color: #777;
    font-size: 13px;
}


/* ================= FILTERS ================= */

.filters {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 30px;
    padding: 15px;

    background: var(--panel);

    border: 1px solid var(--line);
}

.filter-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.filter-button {
    padding: 9px 14px;

    background: transparent;

    border: 1px solid #333;

    color: #aaa;

    font-size: 12px;
}

.filter-button:hover,
.filter-button.active {
    background: white;
    border-color: white;
    color: black;
}

.sort {
    position: relative;
}

.sort select {
    min-width: 190px;

    padding: 10px 12px;

    background: #111;

    border: 1px solid #333;

    color: white;

    outline: none;
}


/* ================= PRODUCTS ================= */

.products-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 18px;
}


/* ================= PRODUCT ================= */

.product {
    position: relative;

    overflow: hidden;

    background: var(--panel);

    border: 1px solid var(--line);
}

.product-image {
    position: relative;

    height: 330px;

    overflow: hidden;

    background: #202020;
}

.product-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    transition: .35s;
}

.product:hover .product-image img {
    transform: scale(1.04);
}


/* ================= FAVORITE ================= */

.favorite {
    position: absolute;

    top: 12px;
    right: 12px;

    z-index: 3;

    width: 37px;
    height: 37px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.7);

    border: 1px solid #444;

    color: white;
}

.favorite:hover {
    background: white;
    color: black;
}

.favorite svg {
    width: 18px;
    height: 18px;

    fill: none;

    stroke: currentColor;
    stroke-width: 1.7;
}

.favorite.active {
    background: white;
    color: black;
}


/* ================= PRODUCT INFO ================= */

.product-info {
    padding: 17px;
}

.product-category {
    margin-bottom: 6px;

    color: #777;

    font-size: 10px;
    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.product-name {
    margin-bottom: 10px;

    font-size: 15px;
}

.rating {
    margin-bottom: 12px;

    color: #aaa;

    font-size: 12px;
}

.price-row {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.price {
    font-size: 17px;
    font-weight: bold;
}

.old-price {
    color: #666;

    font-size: 13px;

    text-decoration: line-through;
}

.product-add {
    width: 100%;

    padding: 12px;

    background: transparent;

    border: 1px solid #444;

    color: white;

    font-size: 11px;
    letter-spacing: .8px;
}

.product-add:hover {
    background: white;
    border-color: white;
    color: black;
}


/* ================= EMPTY ================= */

.empty {
    padding: 80px 20px;

    text-align: center;

    color: #777;
}


/* ================= FOOTER ================= */

.footer {
    margin-top: 70px;

    padding: 45px 30px;

    background: #0d0d0d;

    border-top: 1px solid var(--line);
}

.footer-inner {
    max-width: 1500px;

    margin: auto;

    display: flex;
    justify-content: space-between;

    gap: 30px;
}

.footer-logo {
    font-size: 24px;

    font-weight: bold;

    letter-spacing: 7px;
}

.footer-text {
    max-width: 420px;

    color: #777;

    font-size: 13px;

    line-height: 1.6;
}


/* ================= CART MINI MODAL ================= */

.cart-overlay {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.75);
}

.cart-overlay.open {
    display: flex;
}

.cart-modal {
    width: min(900px, 100%);

    max-height: 90vh;

    overflow: hidden;

    background: #101010;

    border: 1px solid #3a3a3a;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7);
}

.cart-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 20px 25px;

    background: #151515;

    border-bottom: 1px solid var(--line);
}

.cart-title {
    font-size: 20px;
    font-weight: bold;
}

.close-cart {
    width: 35px;
    height: 35px;

    background: transparent;

    border: 1px solid #444;

    color: white;

    font-size: 20px;
}

.close-cart:hover {
    background: white;
    color: black;
}

.cart-list {
    max-height: 60vh;

    overflow-y: auto;

    padding: 20px;
}

.cart-item {
    display: grid;

    grid-template-columns: 75px 1fr auto;

    gap: 15px;

    align-items: center;

    padding: 12px;

    margin-bottom: 10px;

    background: #181818;

    border: 1px solid #292929;
}

.cart-item img {
    width: 75px;
    height: 90px;

    object-fit: cover;
}

.cart-item-name {
    margin-bottom: 7px;
}

.cart-item-price {
    color: #aaa;

    font-size: 13px;
}

.quantity {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 10px;
}

.quantity button {
    width: 27px;
    height: 27px;

    background: #222;

    border: 1px solid #444;

    color: white;
}

.quantity span {
    min-width: 20px;

    text-align: center;
}

.cart-total {
    display: flex;

    justify-content: space-between;

    padding: 20px 25px;

    border-top: 1px solid var(--line);

    font-size: 20px;

    font-weight: bold;
}


/* ================= TOAST ================= */

.toast {
    position: fixed;

    right: 25px;
    bottom: 25px;

    z-index: 1000;

    padding: 14px 18px;

    background: white;

    color: black;

    font-size: 13px;

    transform: translateY(120px);

    opacity: 0;

    transition: .3s;
}

.toast.show {
    transform: translateY(0);

    opacity: 1;
}


/* ================= RESPONSIVE ================= */

@media (max-width: 1100px) {

    .header {
        grid-template-columns:
            150px 1fr 220px;
    }

    .products-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 900px) {

    .header {
        grid-template-columns: 1fr auto;

        padding: 15px 18px;
    }

    .search {
        grid-column: 1 / -1;
        grid-row: 2;

        max-width: none;
    }

    .actions {
        grid-column: 2;
        grid-row: 1;
    }

    .page {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: flex;

        align-items: center;

        gap: 5px;

        overflow-x: auto;

        padding: 10px 15px;

        border-right: 0;

        border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
        display: none;
    }

    .category {
        width: auto;

        min-width: max-content;

        margin: 0;
    }

    .products-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .filters {
        flex-direction: column;

        align-items: stretch;
    }

    .sort select {
        width: 100%;
    }

}

@media (max-width: 600px) {

    .content {
        padding: 18px;
    }

    .page-heading {
        align-items: flex-start;

        flex-direction: column;
    }

    .page-heading h1 {
        font-size: 28px;
    }

    .products-grid {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .product-image {
        height: 230px;
    }

    .product-info {
        padding: 12px;
    }

    .product-name {
        font-size: 13px;
    }

    .footer-inner {
        flex-direction: column;
    }

}

</style>
</head>

/* ================= STATE ================= */

let cart =
    JSON.parse(
        localStorage.getItem("noirCart") || "[]"
    );


let favorites =
    JSON.parse(
        localStorage.getItem("noirFavorites") || "[]"
    );


let currentCategory = "all";


/* ================= CATEGORY ================= */

function getCategoryName(category) {

    const names = {

        clothes: "Одежда",

        shoes: "Обувь",

        accessories: "Аксессуары",

        bags: "Сумки"

    };

    return names[category] || category;

}


/* ================= RENDER ================= */

function renderProducts(list) {

    const grid =
        document.getElementById(
            "productsGrid"
        );

    grid.innerHTML = "";


    if (list.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                Товаров по этому запросу нет.

            </div>

        `;

        return;

    }


    list.forEach(product => {


        const isFavorite =
            favorites.includes(
                product.id
            );


        const card =
            document.createElement(
                "article"
            );


        card.className =
            "product";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <button
                    class="favorite ${
                        isFavorite
                        ? "active"
                        : ""
                    }"
                    onclick="
                        toggleFavorite(
                            ${product.id}
                        )
                    "
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M20.8 8.7c0 5.5-8.8 10.5-8.8 10.5S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6Z"
                        />

                    </svg>

                </button>

            </div>


            <div class="product-info">


                <div class="product-category">

                    ${getCategoryName(
                        product.category
                    )}

                </div>


                <div class="product-name">

                    ${product.name}

                </div>


                <div class="rating">

                    ★ ${product.rating}

                    ·

                    ${product.reviews}
                    отзывов

                </div>


                <div class="price-row">

                    <span class="price">

                        ${formatPrice(
                            product.price
                        )} ₴

                    </span>


                    ${
                        product.oldPrice
                        ?
                        `
                        <span class="old-price">

                            ${formatPrice(
                                product.oldPrice
                            )} ₴

                        </span>
                        `
                        :
                        ""
                    }

                </div>


                <button
                    class="product-add"
                    onclick="
                        addToCart(
                            ${product.id}
                        )
                    "
                >

                    ДОБАВИТЬ В КОРЗИНУ

                </button>


            </div>

        `;


        grid.appendChild(card);

    });

}


/* ================= FILTER ================= */

function filterCategory(category) {

    currentCategory = category;


    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    const buttons =
        document.querySelectorAll(
            ".filter-button"
        );


    buttons.forEach(button => {

        const text =
            button.textContent
                .trim()
                .toLowerCase();


        if (
            (category === "all" &&
                text === "все") ||

            text ===
                getCategoryName(
                    category
                ).toLowerCase()
        ) {

            button.classList.add(
                "active"
            );

        }

    });


    renderFilteredProducts();

}


/* ================= SEARCH ================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderFilteredProducts
    );


/* ================= SORT ================= */

document
    .getElementById(
        "sortSelect"
    )
    .addEventListener(
        "change",
        renderFilteredProducts
    );


function renderFilteredProducts() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    let list =
        products.filter(product => {

            const categoryMatch =
                currentCategory === "all" ||
                product.category ===
                    currentCategory;


            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(search);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    const sort =
        document.getElementById(
            "sortSelect"
        ).value;


    if (sort === "cheap") {

        list.sort(
            (a,b) =>
                a.price - b.price
        );

    }


    if (sort === "expensive") {

        list.sort(
            (a,b) =>
                b.price - a.price
        );

    }


    renderProducts(list);

}


/* ================= CART ================= */

function addToCart(id) {

    const existing =
        cart.find(
            item => item.id === id
        );


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            id: id,

            quantity: 1

        });

    }


    localStorage.setItem(
        "noirCart",
        JSON.stringify(cart)
    );


    updateCartCount();

    showToast(
        "Товар добавлен в корзину"
    );

}


function updateCartCount() {

    const count =
        cart.reduce(
            (sum,item) =>
                sum + item.quantity,
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* ================= FAVORITES ================= */

function toggleFavorite(id) {

    if (
        favorites.includes(id)
    ) {

        favorites =
            favorites.filter(
                item => item !== id
            );

    } else {

        favorites.push(id);

    }


    localStorage.setItem(
        "noirFavorites",
        JSON.stringify(
            favorites
        )
    );


    updateFavoriteCount();

    renderFilteredProducts();

}


function updateFavoriteCount() {

    document.getElementById(
        "favoriteCount"
    ).textContent =
        favorites.length;

}


function showFavorites() {

    const list =
        products.filter(
            product =>
                favorites.includes(
                    product.id
                )
        );


    renderProducts(list);


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ================= CART WINDOW ================= */

function openCart() {

    renderCart();

    document
        .getElementById(
            "cartOverlay"
        )
        .classList.add("open");

}


function closeCart() {

    document
        .getElementById(
            "cartOverlay"
        )
        .classList.remove("open");

}


function closeCartOutside(event) {

    if (
        event.target ===
        document.getElementById(
            "cartOverlay"
        )
    ) {

        closeCart();

    }

}


/* ================= RENDER CART ================= */

function renderCart() {

    const list =
        document.getElementById(
            "cartList"
        );


    list.innerHTML = "";


    let total = 0;


    if (cart.length === 0) {

        list.innerHTML = `

            <div class="empty">

                Корзина пуста.

            </div>

        `;


        document.getElementById(
            "cartTotal"
        ).textContent = "0 ₴";


        return;

    }


    cart.forEach(cartItem => {

        const product =
            products.find(
                item =>
                    item.id ===
                    cartItem.id
            );


        if (!product) return;


        total +=
            product.price *
            cartItem.quantity;


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "cart-item";


        item.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
            >


            <div>

                <div class="cart-item-name">

                    ${product.name}

                </div>


                <div class="cart-item-price">

                    ${formatPrice(
                        product.price
                    )} ₴

                </div>


                <div class="quantity">

                    <button
                        onclick="
                            changeQuantity(
                                ${product.id},
                                -1
                            )
                        "
                    >
                        −
                    </button>


                    <span>

                        ${cartItem.quantity}

                    </span>


                    <button
                        onclick="
                            changeQuantity(
                                ${product.id},
                                1
                            )
                        "
                    >
                        +
                    </button>

                </div>

            </div>

        `;


        list.appendChild(item);

    });


    document.getElementById(
        "cartTotal"
    ).textContent =
        formatPrice(total) + " ₴";

}


/* ================= CHANGE QUANTITY ================= */

function changeQuantity(id, change) {

    const item =
        cart.find(
            product =>
                product.id === id
        );


    if (!item) return;


    item.quantity += change;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                product =>
                    product.id !== id
            );

    }


    localStorage.setItem(
        "noirCart",
        JSON.stringify(cart)
    );


    updateCartCount();

    renderCart();

}


/* ================= HELPERS ================= */

function formatPrice(number) {

    return new Intl.NumberFormat(
        "uk-UA"
    ).format(number);

}


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2000);

}


/* ================= START ================= */

renderFilteredProducts();

updateCartCount();

updateFavoriteCount();


</script>

</body>
</html>
